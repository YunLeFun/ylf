[workspace]
members = [
  "packages/ylf"
]

[workspace.package]
edition = "2021"
include = [
  "build.rs",
  "src/**/*",
  "Cargo.toml",
  "LICENSE*",
  "README.md",
  "benches/**/*",
  "examples/**/*"
]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
# https://course.rs/cargo/reference/profiles.html#release
lto = true
