name: Apple Support UI

on:
  push:
    branches: [main]
    paths: [Package.swift, packages/apple-support/**, .github/workflows/apple-support.yml]
  pull_request:
    paths: [Package.swift, packages/apple-support/**, .github/workflows/apple-support.yml]

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: swift test
      - name: Compile the shared iOS browser
        run: |
          trap 'rm -rf "$RUNNER_TEMP/apple-support"' EXIT
          xcodebuild -scheme YunleApple -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/apple-support" CODE_SIGNING_ALLOWED=NO build
