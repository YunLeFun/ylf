name: Release

# 发布 npm 包。两种触发方式：
#  1) 推送 tag：<包名>@<版本>，例如 `@yunlefun/deploy@0.0.12`、`cilicili@0.1.2`
#  2) 手动：Actions → Release → Run workflow，选择要发布的包目录
#
# 用 npm Trusted Publishing（OIDC，免 token）+ provenance 供应链溯源。
# 需先在 npmjs.com 各包设置里把本仓库的 release.yml 配为 trusted publisher
# （见 .github/workflows/RELEASING.md）。

on:
  push:
    tags:
      - '*@*' # 非 scoped 包：cilicili@0.1.2
      - '*/*@*' # scoped 包：@yunlefun/types@0.0.2（tag glob 中 * 不匹配 /，需单列）
  workflow_dispatch:
    inputs:
      package:
        description: 要发布的包目录（packages/ 下）
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - cilicili
          - ylf
          - types
          - server-session
          - server-session-cloudbase
          - sso
          - support-client

permissions:
  contents: read

concurrency:
  group: ylf-npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing 用 OIDC 换取短期发布凭证
    steps:
      # changelogithub 需要完整历史与全部 tag 才能计算两 tag 间的提交
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 检查通过后才安装依赖、执行包脚本。
      - name: Require release commit on main
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::只允许发布 main 历史上的提交"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) 需要 npm >= 11.5.1；固定版本避免 latest 漂移。
      - name: Install trusted-publishing npm
        run: npm install -g npm@11.16.0

      - name: Install
        run: pnpm install --frozen-lockfile

      # 确定要发布的包目录：手动触发用输入；tag 触发从 <name>@<version> 反查
      - name: Resolve package dir
        id: pkg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dir="packages/${{ inputs.package }}"
          else
            name="${GITHUB_REF_NAME%@*}"
            dir=$(node -e "const fs=require('fs');for(const d of fs.readdirSync('packages')){try{if(require('./packages/'+d+'/package.json').name===process.argv[1]){console.log('packages/'+d);process.exit(0)}}catch{}}process.exit(1)" "$name")
          fi
          [ -n "$dir" ] && [ -f "$dir/package.json" ] || { echo "::error::无法定位包目录"; exit 1; }
          package_name=$(node -p "require('./$dir/package.json').name")
          version=$(node -p "require('./$dir/package.json').version")
          if [ "${{ github.event_name }}" = "push" ] && [ "$GITHUB_REF_NAME" != "$package_name@$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 $package_name@$version 不一致"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 若该版本已发布则跳过，保证可重复运行
      - name: Skip if already published
        id: check
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "已存在 ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # deploy 等包会把同仓的 cilicili 内联进产物（读取其 dist），需先构建这个共享内部库
      - name: Build shared lib (cilicili)
        if: steps.check.outputs.skip == 'false' && steps.pkg.outputs.dir != 'packages/support-client'
        run: pnpm --filter cilicili build

      # ylf 等包直接发布 TS 源码、没有 build 脚本，这里按需跳过
      - name: Build
        if: steps.check.outputs.skip == 'false'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            pnpm run build
          else
            echo "无 build 脚本，跳过构建"
          fi

      - name: Validate Support SDK
        if: steps.check.outputs.skip == 'false' && steps.pkg.outputs.dir == 'packages/support-client'
        run: |
          pnpm --filter @yunlefun/support-client typecheck
          pnpm --filter @yunlefun/support-client test

      # 用 pnpm pack 打包：会把 workspace:* 协议转成真实版本号（npm 不认 workspace:）
      - name: Pack
        if: steps.check.outputs.skip == 'false'
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      - name: Verify Support SDK tarball
        if: steps.check.outputs.skip == 'false' && steps.pkg.outputs.dir == 'packages/support-client'
        run: node scripts/check-support-client-package.mjs "$RUNNER_TEMP/package.tgz"

      # OIDC trusted publishing：无需 token，npm 自动用 id-token 换取发布凭证
      - name: Publish
        if: steps.check.outputs.skip == 'false'
        run: npm publish "$RUNNER_TEMP/package.tgz" --access public

      - name: Verify Support SDK from npm
        if: steps.check.outputs.skip == 'false' && steps.pkg.outputs.dir == 'packages/support-client'
        env:
          SDK_VERSION: ${{ steps.pkg.outputs.version }}
        run: node scripts/check-support-client-package.mjs --registry "$SDK_VERSION"

      - name: Summary
        if: steps.check.outputs.skip == 'false'
        run: echo "✅ 已发布 ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  # GitHub Release 写权限与 npm OIDC 发布权限隔离，避免发布任务拥有不必要的仓库写权限。
  release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create GitHub Release (changelog)
        run: pnpm exec changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
